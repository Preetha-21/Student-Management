<!DOCTYPE html>
<html>

<head>
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Student Management</a>
            <div class="d-flex">
                <span class="navbar-text me-3" id="facultyName">Faculty</span>
                <a href="/logout" class="btn btn-outline-light">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <!-- Add Student Form -->
            <div class="col-md-4">
                <div class="card">
                    <h5>Add Student</h5>
                    <form id="addForm">
                        <input class="form-control mb-2" name="rollno" placeholder="Roll Number" required>
                        <input class="form-control mb-2" name="name" placeholder="Student Name" required>
                        <input class="form-control mb-2" name="marks" placeholder="Marks" required>
                        <button class="btn btn-primary w-100" type="submit">Add Student</button>
                    </form>
                </div>
            </div>

            <!-- Students Table -->
            <div class="col-md-8">
                <div class="card">
                    <h5>Students</h5>
                    <input class="form-control mb-2" id="search" placeholder="Search Student Name">
                    <table class="table table-striped table-hover" id="studentTable">
                        <thead class="table-dark">
                            <tr>
                                <th>Roll</th>
                                <th>Name</th>
                                <th>Marks</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Load students
        function loadStudents(search = "") {
            fetch('/api/students?search=' + search)
                .then(res => res.json())
                .then(data => {
                    const tbody = document.querySelector('#studentTable tbody');
                    tbody.innerHTML = "";
                    data.forEach(s => {
                        let row = document.createElement('tr');
                        row.innerHTML = `
            <td>${s.rollno}</td>
            <td>${s.name}</td>
            <td>${s.marks}</td>
            <td>
              <button class="btn btn-warning btn-sm" onclick="editStudent(${s.id},'${s.rollno}','${s.name}',${s.marks})">Edit</button>
              <button class="btn btn-danger btn-sm" onclick="deleteStudent(${s.id})">Delete</button>
            </td>`;
                        tbody.appendChild(row);
                    });
                });
        }

        // Add student
        document.getElementById('addForm').addEventListener('submit', e => {
            e.preventDefault();
            const form = e.target;
            fetch('/api/students', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    rollno: form.rollno.value,
                    name: form.name.value,
                    marks: form.marks.value
                })
            }).then(() => { form.reset(); loadStudents(); });
        });

        // Delete student
        function deleteStudent(id) {
            if (confirm("Are you sure?")) {
                fetch('/api/students/' + id, { method: 'DELETE' }).then(() => loadStudents());
            }
        }

        // Edit student
        function editStudent(id, rollno, name, marks) {
            let newRoll = prompt("Roll Number:", rollno);
            let newName = prompt("Name:", name);
            let newMarks = prompt("Marks:", marks);
            if (newRoll && newName && newMarks) {
                fetch('/api/students/' + id, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ rollno: newRoll, name: newName, marks: newMarks })
                }).then(() => loadStudents());
            }
        }

        // Search
        document.getElementById('search').addEventListener('input', e => {
            loadStudents(e.target.value);
        });

        // Initial load
        loadStudents();
    </script>
</body>

</html>
